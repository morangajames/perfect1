<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Seller Dashboard - Ubuntu Collection</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #F8F9FA;
            color: #111827;
            margin: 0;
            padding: 0;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #FFFFFF;
            padding: 20px 40px;
            border-bottom: 1px solid #E5E7EB;
        }
        .navbar h1 { margin: 0; font-size: 22px; letter-spacing: 2px; font-weight: 700; text-transform: uppercase;}
        .btn { padding: 10px 20px; text-decoration: none; font-weight: 600; cursor: pointer; border: 2px solid transparent; transition: 0.2s; font-size: 13px; text-transform: uppercase; }
        .btn-outline { background-color: transparent; color: #000000; border: 2px solid #000000; }
        .btn-outline:hover { background-color: #000000; color: #FFFFFF; }

        .container { max-width: 600px; margin: 40px auto; background: #FFFFFF; padding: 40px; border: 1px solid #E5E7EB; }
        h3 { font-weight: 400; margin-bottom: 25px; border-bottom: 2px solid #111827; padding-bottom: 10px; }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #6B7280;}
        input[type="text"], input[type="number"], textarea { width: 100%; padding: 12px; border: 1px solid #E5E7EB; box-sizing: border-box; font-size: 14px; background-color: #F9FAFB; font-family: inherit;}
        input:focus, textarea:focus { outline: none; border-color: #000000; background-color: #FFFFFF;}
        textarea { height: 100px; resize: vertical; }

        input[type="file"] { width: 100%; padding: 10px; border: 1px dashed #000000; background-color: #F9FAFB; cursor: pointer; }

        button {
            width: 100%;
            padding: 15px;
            background-color: #000000;
            color: #FFFFFF;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }
        button:hover { background-color: #333333; }
        .success { background: #F9FAFB; border: 1px solid #000000; text-align: center; padding: 10px; font-size: 14px; margin-bottom: 20px;}
    </style>
</head>
<body>

<div class="navbar">
    <h1>Seller Dashboard</h1>
    <a th:href="@{/}" class="btn btn-outline">Back to Store</a>
</div>

<div class="container">
    <p th:if="${param.success}" class="success">Product added successfully!</p>

    <h3>Add a New Product</h3>

    <form th:action="@{/seller/add-product}" th:object="${product}" method="post" enctype="multipart/form-data">

        <div class="form-group">
            <label>Product Name</label>
            <input type="text" th:field="*{name}" required>
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea th:field="*{description}" required></textarea>
        </div>

        <div class="form-group">
            <label>Price (Ksh)</label>
            <input type="number" step="0.01" th:field="*{price}" required>
        </div>

        <div class="form-group">
            <label>Product Images (Select multiple)</label>
            <!-- Notice the 'multiple' attribute and name="imageFiles" -->
            <input type="file" name="imageFiles" accept="image/*" multiple required>
        </div>

        <button type="submit">Upload Product</button>
    </form>
</div>

</body>
</html>
