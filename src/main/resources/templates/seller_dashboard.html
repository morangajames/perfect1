<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Seller Dashboard - Ubuntu Collection</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #F8F9FA; margin: 0; }
        .navbar { display: flex; justify-content: space-between; align-items: center;
            background: #FFF; padding: 20px 40px; border-bottom: 1px solid #E5E7EB; }
        .navbar h1 { margin: 0; font-size: 22px; letter-spacing: 2px; text-transform: uppercase; }
        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        .header-row { display: flex; justify-content: space-between; align-items: center; }
        .btn { padding: 10px 20px; background: #000; color: #FFF; text-decoration: none;
            font-weight: bold; text-transform: uppercase; font-size: 13px; border: none; cursor: pointer; }
        .btn:hover { background: #333; }
        .btn-danger { background: #B91C1C; }
        .btn-danger:hover { background: #991B1B; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #FFF; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #E5E7EB; }
        th { background: #F3F4F6; text-transform: uppercase; font-size: 12px; }
        .success-msg { background: #D1FAE5; color: #065F46; padding: 12px;
            border: 1px solid #10B981; margin-bottom: 20px; }
        .empty-msg { text-align: center; color: #6B7280; padding: 40px; }
    </style>
</head>
<body>

<div class="navbar">
    <h1>Seller Dashboard</h1>
    <form th:action="@{/logout}" method="post" style="margin: 0;">
        <button type="submit" class="btn">Logout</button>
    </form>
</div>

<div class="container">
    <div class="success-msg" th:if="${success}" th:text="${success}"></div>

    <div class="header-row">
        <h2>My Products</h2>
        <a th:href="@{/seller/products/add}" class="btn">+ Add Product</a>
    </div>

    <table th:if="${not #lists.isEmpty(products)}">
        <thead>
        <tr>
            <th>Image</th>
            <th>Name</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="product : ${products}">
            <td>
                <img th:if="${not #lists.isEmpty(product.imageNames)}"
                     th:src="@{'/images/' + ${product.imageNames[0]}}"
                     style="width: 60px; height: 60px; object-fit: cover;">
            </td>
            <td th:text="${product.name}"></td>
            <td th:text="'Ksh ' + ${product.price}"></td>
            <td th:text="${product.stock}"></td>
            <td>
                <form th:action="@{/seller/products/delete/{id}(id=${product.id})}" method="post" style="margin:0;">
                    <button type="submit" class="btn btn-danger"
                            onclick="return confirm('Delete this product?')">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <p class="empty-msg" th:if="${#lists.isEmpty(products)}">
        You haven't added any products yet. Click "+ Add Product" to start.
    </p>
</div>

</body>
</html>
