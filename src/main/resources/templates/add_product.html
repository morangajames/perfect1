<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Product - Ubuntu Collection</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #F8F9FA;
            color: #111827;
            margin: 0;
        }
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            background-color: #FFFFFF; padding: 20px 40px;
            border-bottom: 1px solid #E5E7EB;
        }
        .navbar h1 { margin: 0; font-size: 22px; letter-spacing: 2px; text-transform: uppercase; }
        .container { max-width: 600px; margin: 40px auto; background: #FFF;
            padding: 40px; border: 1px solid #E5E7EB; }
        h2 { font-weight: 400; margin-top: 0; }
        .input-group { margin-bottom: 20px; }
        .input-group label {
            display: block; margin-bottom: 8px;
            font-weight: bold; font-size: 12px; text-transform: uppercase;
        }
        .input-group input, .input-group textarea {
            width: 100%; padding: 12px; border: 1px solid #000;
            font-size: 14px; box-sizing: border-box;
            font-family: inherit;
        }
        .btn {
            padding: 12px 24px; background-color: #000; color: #FFF;
            border: none; font-weight: bold; text-transform: uppercase;
            cursor: pointer; width: 100%;
        }
        .btn:hover { background-color: #333; }
        .back-link {
            display: block; text-align: center; margin-top: 20px;
            color: #000; text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="navbar">
    <h1>Ubuntu Collection</h1>
    <a th:href="@{/seller/dashboard}" style="color: #000;">← Back to Dashboard</a>
</div>

<div class="container">
    <h2>Add New Product</h2>

    <form th:action="@{/seller/products/add}" th:object="${product}" method="post">

        <div class="input-group">
            <label>Product Name</label>
            <input type="text" th:field="*{name}" required>
        </div>

        <div class="input-group">
            <label>Description</label>
            <textarea th:field="*{description}" rows="4" required></textarea>
        </div>

        <div class="input-group">
            <label>Price (Ksh)</label>
            <input type="number" step="0.01" th:field="*{price}" required>
        </div>

        <div class="input-group">
            <label>Stock Quantity</label>
            <input type="number" th:field="*{stock}" required>
        </div>

        <div class="input-group">
            <label>Image File Name (must exist in /images/)</label>
            <input type="text" name="imageName" placeholder="e.g. shirt1.jpg">
        </div>

        <button type="submit" class="btn">Save Product</button>
    </form>

    <a th:href="@{/seller/dashboard}" class="back-link">Cancel</a>
</div>

</body>
</html>
