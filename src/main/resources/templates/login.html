<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - Ubuntu Collection</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #F9FAFB;
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: #FFFFFF;
            padding: 50px 40px;
            border: 1px solid #E5E7EB;
            width: 350px;
        }
        h2 { text-align: center; margin-bottom: 30px; font-weight: 400; letter-spacing: 2px; text-transform: uppercase;}
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 1px;}
        input { width: 100%; padding: 12px; border: 1px solid #000000; box-sizing: border-box; font-size: 14px;}
        input:focus { outline: none; background-color: #F9FAFB; }
        button {
            width: 100%;
            padding: 15px;
            background-color: #000000;
            color: #FFFFFF;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }
        button:hover { background-color: #333333; }
        .text-center { text-align: center; margin-top: 25px; font-size: 13px; color: #6B7280;}
        .text-center a { color: #000000; text-decoration: underline; font-weight: 600; }
        .error { color: #000000; background: #F9FAFB; border: 1px solid #000000; text-align: center; margin-bottom: 20px; font-size: 13px; padding: 10px;}
        .success { color: #000000; background: #F9FAFB; border: 1px solid #E5E7EB; text-align: center; margin-bottom: 20px; font-size: 13px; padding: 10px;}
    </style>
</head>
<body>

<div class="login-box">
    <h2>Login</h2>

    <p th:if="${param.success}" class="success">Registration successful. Please login.</p>
    <p th:if="${param.error}" class="error">Invalid email or password.</p>
    <p th:if="${param.logout}" class="success">You have logged out.</p>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label>Email</label>
            <input type="text" name="username" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required>
        </div>

        <button type="submit">Sign In</button>
    </form>

    <div class="text-center">
        <p>Don't have an account? <a th:href="@{/register}">Create one</a></p>
    </div>
</div>

</body>
</html>
