spring.application.name=perfect1
# Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/ubuntu_collection_db
spring.datasource.username=root
spring.datasource.password=James@2023!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
